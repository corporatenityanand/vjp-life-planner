  projBizSet(el){UI.projBiz=el.dataset.k;UI.plan=null;render()},
  weekMode(el){UI.weekMode=el.dataset.m;UI.plan=null;render()},
  plan(el){UI.plan=UI.plan===el.dataset.id?null:el.dataset.id;render()},
  pq(el){const q=+el.dataset.q;if(el.dataset.kind==="it"){const it=findItem(el);if(it)setItemQ(it,q)}else{const t=findTask(el.dataset.id);if(t){if(q){[t.u,t.i]=Q2UI[q]}else{t.u=null;t.i=null}syncFromTask(t)}}commit()},
  pd(el){const d=el.dataset.d;if(el.dataset.kind==="it")scheduleItem(el.dataset.s,el.dataset.k,el.dataset.id,d);else{const t=findTask(el.dataset.id);if(t){t.date=d||null;t.top=0}}commit();if(d)toast("Planned for "+fmtDay(d)+".")},
  addTo(el){UI.addTo=el.dataset.s+"|"+el.dataset.k;render();const i=document.getElementById("ia-"+el.dataset.s+"-"+el.dataset.k.replace(/\W/g,""));i&&i.focus()},
  deptEdit(){UI.deptEdit=!UI.deptEdit;render()},
  deptRm(el){const L=[...deptList()];L.splice(+el.dataset.i,1);S.settings.depts=L;commit()},
  projView(el){UI.projView=el.dataset.k;render()},
  addSite(){const s={id:"s"+uid(),name:"New site",business:UI.projBiz!=="all"?UI.projBiz:"NIL",jobType:"",status:"ONGOING",exp:"",receivables:"",depts:{}};S.projects.sites.unshift(s);UI.projStatus="ONGOING";commit();setTimeout(()=>{const i=$("#sn-"+s.id);i&&(i.focus(),i.select())},30)},
  delSite(el){UI.confirmDel=el.dataset.s;render()},
  delSiteNo(){UI.confirmDel=null;render()},
  delSiteYes(el){S.projects.sites=S.projects.sites.filter(s=>s.id!==el.dataset.s);UI.confirmDel=null;commit()},
  showDone(el){UI.showDone[el.dataset.s]=!UI.showDone[el.dataset.s];render()},
  itToggle(el){const it=findItem(el);it.d=!it.d;S.tasks.forEach(t=>{if(t.ref&&t.ref.item===it.id){t.done=it.d}});commit()},
  itDel(el){const s=S.projects.sites.find(x=>x.id===el.dataset.s);s.depts[el.dataset.k]=s.depts[el.dataset.k].filter(i=>i.id!==el.dataset.id);commit()},
  itToday(el){const s=S.projects.sites.find(x=>x.id===el.dataset.s);const it=findItem(el);
    if(S.tasks.some(t=>t.ref&&t.ref.item===it.id&&!t.done&&t.date===todayStr())){toast("Already on today's list.");return}
    newTask(`${s.name} · ${el.dataset.k}: ${it.t.split("\n")[0]}`,"fin",todayStr(),{biz:s.business||"NIL",ref:{site:s.id,dept:el.dataset.k,item:it.id}});commit();toast("Added to today's list.")},
  wgToggle(el){const it=S.projects.weekGoals[el.dataset.k][+el.dataset.i];it.d=!it.d;commit()},
  clToggle(el){const arr=getPath(el.dataset.path);arr[+el.dataset.i].d=!arr[+el.dataset.i].d;commit()},
  clDel(el){getPath(el.dataset.path).splice(+el.dataset.i,1);commit()},
  logSess(el){S.fitlog.sessions.push({id:uid(),date:todayStr(),type:el.dataset.k});commit();toast("Session logged.")},
  tmStart, tmPause, tmReset(){tmReset()}, tmSkip(){tmFinish(true)},
  tmMode(el){if(TM.running)return toast("Pause or finish the current timer first.");tmReset(el.dataset.m)},
  viceSetup(){S.vices.list=["Porn","Alcohol","THC","Cigarettes"].map(n=>({id:n.toLowerCase(),name:n,quitAt:null,relapses:[],urges:[]}));commit()},
  quitEdit(el){UI.quitEdit=el.dataset.id;render()},quitEditCancel(){UI.quitEdit=null;render()},
  urge(el){UI.urge={id:el.dataset.id,until:Date.now()+10*60000};UI.relapseFor=null;render()},
  urgeDone(el){const v=S.vices.list.find(x=>x.id===el.dataset.id);(v.urges=v.urges||[]).push({id:uid(),at:new Date().toISOString(),o:el.dataset.o});UI.urge=null;
    if(el.dataset.o==="lost"){UI.relapseFor=v.id;UI.relTrig=null;commit()}else{commit();toast("Urge beaten. That one counts.")}},
  relapse(el){UI.relapseFor=el.dataset.id;UI.relTrig=null;UI.urge=null;render()},
  relTrig(el){UI.relTrig=UI.relTrig===el.dataset.t?null:el.dataset.t;render()},
  relCancel(){UI.relapseFor=null;render()},
  relDel(el){const v=S.vices.list.find(x=>x.id===el.dataset.id);v.relapses=v.relapses.filter(r=>r.id!==el.dataset.r);commit()},
  hist(el){UI.showHist[el.dataset.id]=!UI.showHist[el.dataset.id];render()},
  rweek(el){const n=+el.dataset.n;UI.reviewWeek=n===0?weekStart(todayStr()):addDays(UI.reviewWeek,n);render()},
  sendNext(){const R=(S.weeks[UI.reviewWeek]||{}).review||{};const nw=addDays(UI.reviewWeek,7);const w=S.weeks[nw]=S.weeks[nw]||{focus:[]};w.focus=w.focus||[];let n=0;
    ["fin","fit","fam"].forEach(p=>{const t=(R["n"+p]||"").trim();if(t&&!w.focus.some(f=>f.t===t)){w.focus.push({t,p,d:false});n++}});commit();toast(n?`Added ${n} to next week's focus.`:"Fill in at least one line first.")},
  async export(){const data=JSON.stringify({app:"vjp-life-planner",exportedAt:new Date().toISOString(),docs:toDocs(S)},null,1);
    try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=`life-planner-${todayStr()}.json`;document.body.appendChild(a);a.click();a.remove();toast("Backup downloaded.");return}catch(e){}
    UI.exportText=data;render()},
  import(){$("#importFile").click()},
  importYes(){const d=UI.importText.docs;S=fromDocs(d);UI.importText=null;commit();toast("Backup imported.")},
  importNo(){UI.importText=null;render()},
};
function findItem(el){const s=S.projects.sites.find(x=>x.id===el.dataset.s);return (s.depts[el.dataset.k]||[]).find(i=>i.id===el.dataset.id)}

const F={
  sheetCfg(){const url=$("#cfgUrl").value.trim(),token=$("#cfgToken").value.trim();if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)||!token){toast("Paste the web app URL (script.google.com/…/exec) and the token.");return}
    CFG={url,token};try{localStorage.setItem("lp-sheet",JSON.stringify(CFG))}catch(e){}dbReady=false;connect().then(()=>{render();if(dbReady)toast("Connected to your Google Sheet.")})},
  addTask(f){const v=$("#addTaskInput").value;const lines=v.split(/\n/).map(x=>x.replace(/^\s*(\[[^\]]*\]|-|\*|•)\s*/,"").trim()).filter(Boolean);if(!lines.length)return;lines.forEach(l=>newTask(l,UI.addPillar,UI.day));commit();const i=$("#addTaskInput");i.value="";i.focus()},
  editTask(f){const t=findTask(f.dataset.id);const v=$("#edit-"+t.id).value.trim();if(v)t.t=v;UI.editing=null;commit()},
  wfAdd(){const v=$("#wfAdd").value.trim();if(!v)return;const w=S.weeks[UI.week]=S.weeks[UI.week]||{focus:[]};(w.focus=w.focus||[]).push({t:v,p:UI.addPillar,d:false});commit();$("#wfAdd").focus()},
  dayAdd(f){const d=f.dataset.d||null;const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return;newTask(v,UI.addPillar,d);const id=inp.id;commit();const n=document.getElementById(id);n&&n.focus()},
  deptAdd(){const v=$("#deptAddIn").value.trim();if(!v)return;const L=[...deptList()];if(!L.includes(v))L.push(v);S.settings.depts=L;commit();const i=$("#deptAddIn");i&&i.focus()},
  itAdd(f){UI.addTo=null;const s=S.projects.sites.find(x=>x.id===f.dataset.s);const inp=f.querySelector("input");const v=inp.value.trim();if(!v)return;(s.depts[f.dataset.k]=s.depts[f.dataset.k]||[]).push({id:uid(),t:v,d:false});const id=inp.id;commit();const n=document.getElementById(id);n&&n.focus()},
  clAdd(f){const arr=getPath(f.dataset.path);const inp=f.querySelector("input");const v=inp.value.trim();if(!v||!arr)return;arr.push({t:v,d:false});const id=inp.id;commit();const n=document.getElementById(id);n&&n.focus()},
  bodyAdd(){const kg=+$("#bkg").value,lean=+$("#blean").value;if(!kg)return toast("Enter your weight in kg.");S.fitlog.body=S.fitlog.body.filter(b=>b.date!==$("#bd").value);S.fitlog.body.push({id:uid(),date:$("#bd").value||todayStr(),kg,lean:lean||null});commit();toast("Logged.")},
  famAdd(f){const type=f.dataset.type;const note=f.querySelector("input[type=text]").value.trim();const date=f.querySelector("input[type=date]").value||todayStr();S.famlog.events.push({id:uid(),type,date,note});commit();toast(type==="date"?"Date logged.":"Outing logged.")},
  personAdd(){const v=$("#personAdd").value.trim();if(!v)return;S.goals.family.people.push({name:v,last:""});commit()},
  park(){const v=$("#parkInput").value.trim();if(!v)return;newTask(v,"oth",null);commit();toast("Parked in Someday. Back to it.");$("#parkInput").focus()},
  quitSet(f){const v=$("#qd-"+f.dataset.id).value;if(!v)return;const x=S.vices.list.find(q=>q.id===f.dataset.id);x.quitAt=new Date(v).toISOString();UI.quitEdit=null;commit()},
  relapse(f){const v=S.vices.list.find(x=>x.id===f.dataset.id);const at=$("#rlAt").value;(v.relapses=v.relapses||[]).push({id:uid(),at:at?new Date(at).toISOString():new Date().toISOString(),trigger:UI.relTrig||"",note:$("#rlNote").value.trim()});UI.relapseFor=null;UI.relTrig=null;commit();toast("Logged. The clock restarts now. You've done it before.")},
};
const C={
  taskDate(el){const t=findTask(el.dataset.id);t.date=el.value||null;t.top=0;UI.openMenu=null;commit()},
  taskBiz(el){findTask(el.dataset.id).biz=el.value||null;commit()},
  projBiz(el){UI.projBiz=el.value;render()},
  siteField(el){const s=S.projects.sites.find(x=>x.id===el.dataset.s);s[el.dataset.k]=el.value;commit()},
  addDept(el){if(!el.value)return;const s=S.projects.sites.find(x=>x.id===el.dataset.s);s.depts[el.value]=s.depts[el.value]||[];commit()},
  goalNum(el){setPath(el.dataset.path,+el.value||0);commit()},
  goalText(el){setPath(el.dataset.path,el.value);commit()},
  bizNum(el){S.goals.biz[+el.dataset.i][el.dataset.k]=+el.value||0;commit()},
  personLast(el){S.goals.family.people[+el.dataset.i].last=el.value;if(el.value)S.famlog.events.push({id:uid(),type:"checkup",date:el.value,note:S.goals.family.people[+el.dataset.i].name});commit()},
  tmTask(el){TM.taskId=el.value||null;saveTM();render()},
  tmStep(el){TM.step=el.value;saveTM()},
  setNum(el){S.settings[el.dataset.k]=Math.max(1,+el.value||1);if(!TM.running)TM.left=null;commit()},
  setSound(el){S.settings.sound=el.checked;commit()},
  review(el){const w=S.weeks[UI.reviewWeek]=S.weeks[UI.reviewWeek]||{focus:[]};(w.review=w.review||{})[el.dataset.k]=el.value;const q=QUIET;QUIET=true;commit();QUIET=q},
};
function setPath(path,val){const ks=path.split(".");const last=ks.pop();const o=ks.reduce((o,k)=>o[k],S);o[last]=val}

document.addEventListener("click",e=>{const el=e.target.closest("[data-a]");if(!el)return;const fn=A[el.dataset.a];if(fn){e.preventDefault();ensureAudio();fn(el,e)}});
document.addEventListener("submit",e=>{const f=e.target.closest("[data-f]");if(!f)return;e.preventDefault();const fn=F[f.dataset.f];fn&&fn(f)});
document.addEventListener("change",e=>{const el=e.target.closest("[data-c]");if(!el)return;const fn=C[el.dataset.c];fn&&fn(el)});
/* save while typing, without re-rendering, so a refresh right after typing doesn't lose the edit */
/* what's on screen is the truth: copy every simple field into the data (used by Save, and for selects whose change event a host may swallow) */
const SAFE_C=["siteField","bizNum","goalNum","goalText","review","setNum"];
function captureScreen(){QUIET=true;try{document.querySelectorAll("[data-c]").forEach(el=>{if(SAFE_C.includes(el.dataset.c)&&C[el.dataset.c])C[el.dataset.c](el)})}finally{QUIET=false}}
document.addEventListener("input",e=>{const el=e.target.closest("select[data-c]");if(el&&SAFE_C.includes(el.dataset.c)){C[el.dataset.c](el)}});
document.addEventListener("input",e=>{const el=e.target.closest("input[data-c],textarea[data-c]");if(!el||/^(date|datetime-local|checkbox|file)$/.test(el.type))return;const fn=C[el.dataset.c];if(!fn)return;QUIET=true;try{fn(el)}finally{QUIET=false}});
/* leaving the page with unsaved records: hand them to the Sheet in the background (they stay marked unsaved until a load confirms) */
function beaconSave(){cacheLocal();if(!CFG||!DIRTY.size)return;const m=toDocs(S);const docs={};[...DIRTY].forEach(k=>{if(m[k])docs[k]=m[k]});
  try{navigator.sendBeacon(CFG.url,new Blob([JSON.stringify({token:CFG.token,docs})],{type:"text/plain;charset=utf-8"}))}catch(e){}}
window.addEventListener("pagehide",beaconSave);
document.addEventListener("visibilitychange",()=>{if(document.hidden)beaconSave()});
document.addEventListener("focusout",e=>{const f=e.target.closest('form[data-f="editTask"]');if(f&&UI.editing){setTimeout(()=>{if(UI.editing&&!f.contains(document.activeElement)){F.editTask(f)}},0)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){UI.editing=null;UI.openMenu=null;UI.swapFor=null;render()}
  if(e.key==="n"&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)&&UI.view==="today"){e.preventDefault();$("#addTaskInput").focus()}});
document.addEventListener("paste",e=>{if(e.target.id!=="addTaskInput")return;const txt=(e.clipboardData||window.clipboardData).getData("text");if(txt&&txt.includes("\n")){e.preventDefault();e.target.value=txt;F.addTask()}});
$("#importFile").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.docs)throw 0;UI.importText={name:f.name,docs:j.docs};render()}catch(x){toast("That file isn't a planner backup.")}};r.readAsText(f);e.target.value=""});
function route(){const h=location.hash.slice(1);UI.view=["today","week","projects","goals","focus","quit","review"].includes(h)?h:"week";UI.openMenu=null;UI.plan=null;UI.editing=null;render();window.scrollTo(0,0)}
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){if(UI.day<todayStr()&&UI.view==="today")UI.day=todayStr();tickAll();if(TM.running&&TM.mode==="work")grabWake()}});

loadLocal();route();connect();
</script>

</body>
